<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="external-review: a second opinion from other model families">
  <rect width="1200" height="400" fill="#0f1722"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="150" font-size="64" font-weight="700" fill="#e8e2d6" letter-spacing="-1">external-review</text>
    <text x="72" y="200" font-size="24" fill="#9aa7b5">a second opinion from other model families</text>
    <text x="72" y="236" font-size="18" fill="#9aa7b5">reviewers run your tests in a repo snapshot · every finding carries evidence</text>
  </g>
  <!-- flow: repo → snapshot → reviewers → merged report -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e8e2d6">
    <rect x="72" y="292" width="110" height="44" rx="6" fill="none" stroke="#e8e2d6" stroke-width="2"/>
    <text x="127" y="320" text-anchor="middle">repo</text>
    <path d="M182 314 H226" stroke="#9aa7b5" stroke-width="2"/><path d="M220 308 L228 314 L220 320" fill="none" stroke="#9aa7b5" stroke-width="2"/>
    <rect x="230" y="292" width="130" height="44" rx="6" fill="none" stroke="#e8e2d6" stroke-width="2"/>
    <text x="295" y="320" text-anchor="middle">snapshot</text>
    <path d="M360 314 H404" stroke="#9aa7b5" stroke-width="2"/><path d="M398 308 L406 314 L398 320" fill="none" stroke="#9aa7b5" stroke-width="2"/>
    <g fill="#e8e2d6">
      <rect x="408" y="270" width="88" height="26" rx="5" fill="none" stroke="#ff7a5c" stroke-width="2"/><text x="452" y="288" text-anchor="middle" font-size="13">glm</text>
      <rect x="408" y="301" width="88" height="26" rx="5" fill="none" stroke="#ff7a5c" stroke-width="2"/><text x="452" y="319" text-anchor="middle" font-size="13">kimi</text>
      <rect x="408" y="332" width="88" height="26" rx="5" fill="none" stroke="#ff7a5c" stroke-width="2"/><text x="452" y="350" text-anchor="middle" font-size="13">grok</text>
      <rect x="502" y="285" width="88" height="26" rx="5" fill="none" stroke="#ff7a5c" stroke-width="2"/><text x="546" y="303" text-anchor="middle" font-size="13">codex</text>
      <rect x="502" y="316" width="88" height="26" rx="5" fill="none" stroke="#ff7a5c" stroke-width="2"/><text x="546" y="334" text-anchor="middle" font-size="13">opus</text>
    </g>
    <path d="M590 314 H634" stroke="#9aa7b5" stroke-width="2"/><path d="M628 308 L636 314 L628 320" fill="none" stroke="#9aa7b5" stroke-width="2"/>
    <rect x="638" y="292" width="150" height="44" rx="6" fill="none" stroke="#e8e2d6" stroke-width="2"/>
    <text x="713" y="320" text-anchor="middle">merged.md</text>
    <path d="M788 314 H832" stroke="#9aa7b5" stroke-width="2"/><path d="M826 308 L834 314 L826 320" fill="none" stroke="#9aa7b5" stroke-width="2"/>
    <rect x="836" y="292" width="110" height="44" rx="6" fill="none" stroke="#e8e2d6" stroke-width="2"/>
    <text x="891" y="320" text-anchor="middle">triage</text>
  </g>
  <!-- evidence tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="980" y="120" width="132" height="30" rx="15" fill="#ff7a5c"/><text x="1046" y="140" text-anchor="middle" fill="#0f1722">evidence: ran</text>
    <rect x="980" y="160" width="132" height="30" rx="15" fill="none" stroke="#ff7a5c" stroke-width="2"/><text x="1046" y="180" text-anchor="middle" fill="#e8e2d6">evidence: read</text>
    <rect x="980" y="200" width="132" height="30" rx="15" fill="none" stroke="#9aa7b5" stroke-width="2"/><text x="1046" y="220" text-anchor="middle" fill="#9aa7b5">inferred ≤ 60</text>
  </g>
