name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test suite (syntax, shellcheck, unit, fixture, end-to-end with the stub reviewer)
        run: tests/ci.sh
